# Serves the built frontend and proxies /api to the backend on the same
# origin, so CORS isn't needed in production. TLS is terminated in front
# of this container (see deploy/docker-compose.prod.yml / your load
# balancer); the backend runs with TRUST_PROXY=1 and refuses plain HTTP.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;

  # The OIDC provider must be allowed in connect-src (token + discovery
  # calls) and form-action (login redirect). Set OIDC_ORIGIN at deploy time
  # by editing this line, e.g. https://idp.hospital-a.example
  set $oidc_origin "https://idp.hospital-a.example";

  # nginx only inherits add_header into a location that sets none of its
  # own, so every location includes the same security headers.
  include /etc/nginx/conf.d/security-headers.inc;

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
  }

  # Metrics are for the internal monitoring network only.
  location = /api/metrics { return 404; }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location / {
    add_header Cache-Control "no-store";
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri /index.html;
  }
}
